server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: securebank-core
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/securebank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:securebank}
    password: ${DB_PASSWORD:securebank}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}      # use 'validate' + Flyway/Liquibase in production
    properties:
      hibernate:
        jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: securebank-fraud-detection
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.securebank.fraud
        spring.json.value.default.type: com.securebank.fraud.TransactionEvent
        spring.json.use.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [req=%X{requestId:-}]"

securebank:
  jwt:
    secret: ${JWT_SECRET}                 # >= 32 bytes, injected from env / secret store
    issuer: securebank
    access-token-minutes: 15
  crypto:
    aes-key: ${AES_KEY}                   # base64 encoded 256-bit key
  otp:
    length: 6
    ttl-seconds: 300
    max-attempts: 3
    block-seconds: 900
    log-plaintext: false
  lockout:
    max-failed-attempts: 5
    lock-minutes: 30
  bank:
    per-transaction-limit: 1000000
    current-overdraft-limit: 10000
    gl-account-number: GL0000000001
  fraud:
    high-value-threshold: 500000
    velocity-max-transactions: 5
    velocity-window-seconds: 60
    geo-window-minutes: 30
  kafka:
    transactions-topic: transactions.completed
  reconciliation:
    enabled: true
    cron: "0 30 0 * * *"
